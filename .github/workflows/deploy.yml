name: Deploy to Server

# Manual only: pushing to main does not deploy. Run it from the Actions tab ("Run workflow").
# To deploy automatically again, add this under `on:` (before `workflow_dispatch:`):
#   push:
#     branches: [main]
#     paths: ["docker-compose.yml", "services/**", "scripts/**", ".github/workflows/deploy.yml"]
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Database Services
    needs: validate
    runs-on: ubuntu-latest
    environment: Hetzner
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Back up running databases
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} << 'EOF'
          set -e
          cd ${{ vars.DEPLOY_PATH }}

          # Runs the currently deployed scripts and .env, before anything changes.
          # Skipped only on a first deploy (no .env, or a successful query that finds no running postgres).
          if [ ! -f .env ]; then
            echo "No .env on the server; skipping pre-deploy backup"
            exit 0
          fi
          if ! running=$(docker compose ps --status running -q postgres); then
            echo "Error: cannot inspect running containers; refusing to deploy without a backup" >&2
            exit 1
          fi
          if [ -n "$running" ]; then
            ./scripts/backup.sh
          else
            echo "No running postgres; skipping pre-deploy backup"
          fi
          EOF

      - name: Create .env file
        env:
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_DB: ${{ secrets.PG_DB }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          OFFSITE_BACKUP: ${{ secrets.OFFSITE_BACKUP }}
          OFFSITE_STORAGE: ${{ secrets.OFFSITE_STORAGE }}
          OFFSITE_BUCKET: ${{ secrets.OFFSITE_BUCKET }}
          OFFSITE_ENDPOINT: ${{ secrets.OFFSITE_ENDPOINT }}
          OFFSITE_REGION: ${{ secrets.OFFSITE_REGION }}
          OFFSITE_ACCESS_KEY_ID: ${{ secrets.OFFSITE_ACCESS_KEY_ID }}
          OFFSITE_SECRET_ACCESS_KEY: ${{ secrets.OFFSITE_SECRET_ACCESS_KEY }}
          OFFSITE_PASSWORD: ${{ secrets.OFFSITE_PASSWORD }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          HEALTHCHECK_MAINTENANCE_URL: ${{ secrets.HEALTHCHECK_MAINTENANCE_URL }}
        run: |
          umask 077
          echo "TAILSCALE_IP=" > .env
          for key in PG_USER PG_PASSWORD PG_DB REDIS_PASSWORD \
                     OFFSITE_BACKUP OFFSITE_STORAGE OFFSITE_BUCKET OFFSITE_ENDPOINT OFFSITE_REGION \
                     OFFSITE_ACCESS_KEY_ID OFFSITE_SECRET_ACCESS_KEY OFFSITE_PASSWORD \
                     HEALTHCHECK_URL HEALTHCHECK_MAINTENANCE_URL; do
            value="${!key}"
            # Scripts read .env with bash and Compose with its own parser. A single-quoted value is
            # literal in both, but neither can hold a single quote (or a newline) inside it.
            case "$value" in
              *\'*|*$'\n'*)
                echo "::error::Secret $key contains a single quote or a newline, which .env cannot represent; change the secret."
                exit 1
                ;;
            esac
            echo "$key='$value'" >> .env
          done

      - name: Validate .env file
        run: |
          umask 077
          # Same file with a placeholder Tailscale IP (the server fills in the real one). Compose
          # errors can quote the offending line, so their output is discarded.
          sed 's/^TAILSCALE_IP=.*/TAILSCALE_IP=100.64.0.1/' .env > "$RUNNER_TEMP/validate.env"
          if ! docker compose --env-file "$RUNNER_TEMP/validate.env" config --quiet >/dev/null 2>&1; then
            echo "::error::Compose cannot parse the generated .env; check the secret values."
            exit 1
          fi
          if ! (set -a; . "$RUNNER_TEMP/validate.env") >/dev/null 2>&1; then
            echo "::error::The generated .env cannot be loaded by the shell scripts; check the secret values."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/validate.env"

      - name: Copy .env file to server
        run: |
          # scp keeps the mode of an existing destination file, so never write the secrets
          # over .env directly: upload to a fresh private file, then replace .env atomically.
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} "cd ${{ vars.DEPLOY_PATH }} && rm -f .env.new"
          scp -P ${{ secrets.SSH_PORT }} .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/.env.new
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} "cd ${{ vars.DEPLOY_PATH }} && chmod 600 .env.new && mv -f .env.new .env"

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} << 'EOF'
          set -e
          cd ${{ vars.DEPLOY_PATH }}

          # Defensive: .env was just replaced with a 600 file; keep it that way
          chmod 600 .env

          git fetch origin
          git checkout --force ${{ github.sha }}

          docker compose pull
          chmod +x scripts/setup.sh
          ./scripts/setup.sh
          docker image prune -f

          echo "Deploy completed successfully"
          EOF