# To add a new database service to this stack:
# 1. Add a new service block under `services:` following the pattern below.
# 2. Create a new configuration/init folder under `services/<name>/` if required.
# 3. Define and document its new environment variables in `.env.example`.
# 4. Open its service port (add to PORTS array) in `scripts/setup.sh`.
# 5. Give it `logging: *default-logging` so container logs cannot fill the disk.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.3-alpine
    container_name: postgres_db
    restart: unless-stopped
    # Default is 10s, after which Docker SIGKILLs Postgres and forces crash recovery.
    stop_grace_period: 60s
    logging: *default-logging
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${TAILSCALE_IP}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start runs initdb; do not count those probes as failures
      start_period: 30s
    networks:
      - db-net

  redis:
    image: redis:7.2.5-alpine
    container_name: redis_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${TAILSCALE_IP}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net

  # restic client for scripts/offsite.sh. It is in the `tools` profile, so `docker compose up`
  # never starts it; the script runs it on demand with RESTIC_REPOSITORY exported.
  offsite:
    image: restic/restic:0.19.1
    profiles: ["tools"]
    logging: *default-logging
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${OFFSITE_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${OFFSITE_REGION:-}
    volumes:
      - ./backups:/backups:ro
    networks:
      - db-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  db-net:
    driver: bridge
